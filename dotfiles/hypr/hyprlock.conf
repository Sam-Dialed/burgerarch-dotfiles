source = ~/.config/hypr/colors.conf

background {
    monitor =
    path = $image
    blur_passes = 3
    blur_size = 7
    brightness = 0.6
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $primary
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    position = 0, 200
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = $on_surface_variant
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 110
    halign = center
    valign = center
}

# Password field
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    inner_color = rgba(0, 0, 0, 0.0)
    outer_color = $primary
    check_color = $primary_container
    fail_color = $error
    font_color = $on_surface
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    placeholder_text = <i>Enter Password</i>
    rounding = 10
    position = 0, -20
    halign = center
    valign = center
}
